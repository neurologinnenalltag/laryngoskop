<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EKG-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine schmale Spalte fürs Handy; oben Fortschritt, darunter genau eine Frage, unten feste Navigation. */
:root{
  --bg:#f7f4f2; --surface:#ffffff; --fg:#1c1416; --muted:#63585a; --line:#e0d9d5;
  --accent:#a10030; --accent-fg:#ffffff; --hi:#ec8c06; --hi-fg:#1c1416;
  --good:#17794a; --good-bg:#e1f3e9; --bad:#b8322a; --bad-bg:#fbe6e3;
  --paper:#fffdfb; --wall:#efe6df; --grid:#f6d3d8; --grid-b:#eaa3ad; --trace:#1c1416;
  --oA:#2757c9; --oB:#c2570c; --oC:#7a3fb5; --oD:#0d7f8a;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151213; --surface:#201b1c; --fg:#f1ebea; --muted:#b3a8a8; --line:#3a3033;
  --accent:#ffad42; --accent-fg:#2a1500; --hi:#ec8c06; --hi-fg:#1c1416;
  --good:#6fd79c; --good-bg:#153526; --bad:#ff9b90; --bad-bg:#40201d;
  --paper:#1a1516; --wall:#4a3a33; --grid:#2a2123; --grid-b:#3d2f32; --trace:#ffbe6b;
  --oA:#3f6fe0; --oB:#cf6a1f; --oC:#9259cf; --oD:#1795a1; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#151213; --surface:#201b1c; --fg:#f1ebea; --muted:#b3a8a8; --line:#3a3033;
  --accent:#ffad42; --accent-fg:#2a1500; --hi:#ec8c06; --hi-fg:#1c1416;
  --good:#6fd79c; --good-bg:#153526; --bad:#ff9b90; --bad-bg:#40201d;
  --paper:#1a1516; --wall:#4a3a33; --grid:#2a2123; --grid-b:#3d2f32; --trace:#ffbe6b;
  --oA:#3f6fe0; --oB:#cf6a1f; --oC:#9259cf; --oD:#1795a1; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 17px/1.45 var(--body);margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font:700 20px/1.1 var(--display);letter-spacing:-.01em}
.score{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hi);border-radius:3px}
.jump{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
select{font:500 16px var(--body);color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;max-width:100%}
.jump select{padding:6px 10px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font:700 15px var(--display);background:var(--hi);color:var(--hi-fg);border-radius:999px;padding:4px 12px}
.sec{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
h1{font:700 22px/1.22 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.fig{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.fig svg{display:block;width:100%;height:auto}
.fig.small{max-width:440px;align-self:center;width:100%}
.figs{display:flex;flex-direction:column;gap:8px}
.opts{display:flex;flex-direction:column;gap:10px}
button{font:600 16px var(--body);cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:12px 14px;text-align:left}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.opt{display:flex;gap:12px;align-items:center}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 16px var(--display)}
.oA .l,.tile.oA{background:var(--oA)}.oB .l,.tile.oB{background:var(--oB)}.oC .l,.tile.oC{background:var(--oC)}.oD .l,.tile.oD{background:var(--oD)}
.opt .x{min-width:0;font-weight:500}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt .tag{margin-left:auto;flex:none;font-size:13px;font-weight:700}
.good .tag,.r.good .res{color:var(--good)} .bad .tag,.r.bad .res{color:var(--bad)}
.tile{border-radius:16px;color:#fff;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.tile b{font:700 96px/1 var(--display)}
.tile span{font-weight:600;max-width:30ch}
.hint{color:var(--muted);font-size:15px;text-align:center}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);text-align:center}
.ghost{text-align:center}
.rowbtn{display:flex;gap:10px;flex-wrap:wrap}.rowbtn>*{flex:1 1 140px}
.rows{display:flex;flex-direction:column;gap:10px}
.r{display:grid;grid-template-columns:minmax(64px,auto) 1fr;gap:6px 10px;align-items:center}
.r label{font-weight:700}
.r .res{grid-column:2;font-size:14px;font-weight:600}
.why{border-radius:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--line)}
.why b{display:block;margin-bottom:2px}
.why.good b{color:var(--good)}.why.bad b{color:var(--bad)}
ol.seq{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
ol.seq li{padding-left:4px}
ol.seq li.good{color:var(--good);font-weight:600} ol.seq li.bad{color:var(--bad);font-weight:600}
.empty{color:var(--muted);font-size:15px;border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
nav button{flex:1;text-align:center}
.end h1{font-size:26px}
.big{font:700 54px/1 var(--display);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><span class="brand">EKG-Quiz</span><span class="score" id="score"></span></div>
    <div class="bar" aria-hidden="true"><i id="bar" style="width:0"></i></div>
    <div class="jump"><label for="jump">Springen zu</label><select id="jump"></select></div>
  </header>
  <main id="main"></main>
</div>
<nav><div class="in"><button id="prev" type="button">Zurück</button><button id="next" type="button" class="primary">Weiter</button></div></nav>
<script src="ekg.js?v=202610061356"></script>
<script src="quiz.js?v=202610061356"></script>

</body>
</html>
